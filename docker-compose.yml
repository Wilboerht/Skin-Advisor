services:
  postgres:
    image: postgres:16-alpine
    container_name: skin-advisor-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: skin_advisor
    ports:
      - "5542:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d skin_advisor"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    image: skin-advisor:latest
    container_name: skin-advisor-app
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/skin_advisor
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
